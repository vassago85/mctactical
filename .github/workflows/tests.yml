name: tests

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run API tests
        run: dotnet test tests/HuntexPos.Api.Tests/HuntexPos.Api.Tests.csproj --nologo --verbosity minimal
